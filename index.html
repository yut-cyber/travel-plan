<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>登录 · Nimbus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #1f2733 0%, #2c3a4d 55%, #384a60 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      color: #e8edf4;
      -webkit-tap-highlight-color: transparent;
    }
    .clock {
      font-size: 13px; letter-spacing: 2px; color: #8fa1b8;
      margin-bottom: 28px; user-select: none; font-variant-numeric: tabular-nums;
    }
    .card {
      width: 100%; max-width: 350px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 18px;
      padding: 34px 30px 28px;
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, #5b8def, #7d6bf0);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700; color: #fff; margin: 0 auto 18px;
    }
    h1 { font-size: 20px; text-align: center; font-weight: 600; letter-spacing: 1px; }
    .sub { font-size: 13px; color: #93a5bd; text-align: center; margin: 6px 0 26px; }
    form { display: flex; flex-direction: column; gap: 14px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #a8b8cd; }
    input {
      font: inherit; font-size: 16px; padding: 11px 14px;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px; color: #e8edf4; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #5b8def; }
    input::placeholder { color: #63748c; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
    .chk { flex-direction: row; align-items: center; gap: 6px; display: flex; color: #93a5bd; cursor: pointer; }
    .chk input { width: auto; }
    a { color: #7ea4e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .err {
      font-size: 13px; color: #ff8f7a; text-align: center; min-height: 1.2em;
    }
    .btn {
      font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 6px; text-indent: 6px;
      padding: 12px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, #4d7fe0, #6a5ce8); color: #fff;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.985); }
    .btn[disabled] { opacity: .6; cursor: default; }
    .foot { font-size: 13px; color: #93a5bd; text-align: center; margin-top: 24px; }
    .tip { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 11px; color: #4d5c72; letter-spacing: 1px; }
    .card.shake { animation: shake .4s; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">--/--/-- --:--:--</div>

  <main class="card" id="card">
    <div class="logo">N</div>
    <h1>Nimbus</h1>
    <p class="sub">登录你的工作区</p>
    <form id="form" novalidate>
      <label>邮箱
        <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
      </label>
      <label>密码
        <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
      </label>
      <div class="row">
        <label class="chk"><input type="checkbox" id="remember">记住我</label>
        <a href="javascript:void(0)" id="forgot">忘记密码？</a>
      </div>
      <p class="err" id="err" hidden>邮箱或密码不正确</p>
      <button class="btn" type="submit" id="btn">登 录</button>
    </form>
  </main>

  <p class="foot">还没有账户？<a href="javascript:void(0)" id="reg">联系管理员开通</a></p>
  <p class="tip">© Nimbus Workspace</p>

  <script>
    (function () {
      'use strict';

      function tick() {
        var n = new Date();
        function p(x) { return x < 10 ? '0' + x : '' + x; }
        var week = ['日', '一', '二', '三', '四', '五', '六'][n.getDay()];
        document.getElementById('clock').textContent =
          n.getFullYear() + '/' + p(n.getMonth() + 1) + '/' + p(n.getDate()) +
          ' ' + p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds()) +
          ' 周' + week;
      }
      tick();
      setInterval(tick, 1000);

      document.getElementById('clock').addEventListener('click', function () {
        location.replace('plan.html');
      });

      var form = document.getElementById('form');
      var card = document.getElementById('card');
      var btn = document.getElementById('btn');
      var err = document.getElementById('err');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = '验证中…';
        err.hidden = true;
        setTimeout(function () {
          btn.disabled = false;
          btn.textContent = '登 录';
          err.hidden = false;
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        }, 700 + Math.floor(Math.random() * 500));
      });

      document.getElementById('forgot').addEventListener('click', function () {
        err.hidden = false;
        err.textContent = '请联系管理员重置密码';
        setTimeout(function () { err.textContent = '邮箱或密码不正确'; }, 2500);
      });

      document.getElementById('reg').addEventListener('click', function () {
        err.hidden = false;
        err.textContent = '暂不支持自助注册';
        setTimeout(function () { err.textContent = '邮箱或密码不正确'; }, 2500);
      });
    })();
  </script>
</body>
</html>
